<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CETI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1B365D 0%, #2A4B7C 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        .auth-header {
            background: var(--navy);
            color: #fff;
            padding: 24px 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #cfe2ff;
            font-size: 13px;
        }

        .auth-body {
            padding: 28px 24px 24px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
        }

        .auth-form input,
        .auth-form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .auth-form input:focus,
        .auth-form select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0,128,255,0.12);
        }

        .auth-form button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--blue);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            margin-top: 8px;
        }

        .auth-links a {
            color: var(--blue);
            text-decoration: none;
        }

        .small-text {
            font-size: 12px;
            text-align: center;
            color: var(--text-muted);
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>CETI</h1>
            <p>Sistema de Agendamento</p>
        </div>

        <div class="auth-body">
            <form id="loginForm" class="auth-form">
                <div>
                    <label for="emailLogin">E-mail</label>
                    <input id="emailLogin" type="email" placeholder="Digite seu e-mail" required>
                </div>

                <div>
                    <label for="senhaLogin">Senha</label>
                    <input id="senhaLogin" type="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit">Entrar</button>

                <div class="auth-links">
                    <a href="register.html">Criar conta</a>
                    <a href="reset-password.html">Esqueci a senha</a>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
