<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CETI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1B365D 0%, #2A4B7C 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        .auth-header {
            background: var(--navy);
            color: #fff;
            padding: 24px 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #cfe2ff;
            font-size: 13px;
        }

        .auth-body {
            padding: 28px 24px 24px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
        }

        .auth-form input,
        .auth-form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .auth-form input:focus,
        .auth-form select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0,128,255,0.12);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 46px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 4px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--navy);
            cursor: pointer;
        }

        .password-toggle:hover {
            background: #eef3f8;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .auth-form button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--blue);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-links {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            margin-top: 8px;
        }

        .auth-links a {
            color: var(--blue);
            text-decoration: none;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            height: 1px;
            flex: 1;
            background: #dbe3ef;
        }

        #googleLoginButton {
            display: flex;
            justify-content: center;
            min-height: 40px;
        }

        #googleLoginStatus {
            min-height: 16px;
            margin-top: 8px;
            color: #a33;
            font-size: 12px;
            text-align: center;
        }

        .small-text {
            font-size: 12px;
            text-align: center;
            color: var(--text-muted);
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>CETI</h1>
            <p>Sistema de Agendamento</p>
        </div>

        <div class="auth-body">
            <form id="loginForm" class="auth-form">
                <div>
                    <label for="emailLogin">E-mail</label>
                    <input id="emailLogin" type="email" placeholder="Digite seu e-mail" required>
                </div>

                <div>
                    <label for="senhaLogin">Senha</label>
                    <div class="password-field">
                        <input id="senhaLogin" type="password" placeholder="Digite sua senha" required>
                        <button id="toggleSenha" class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="senhaLogin" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <path class="password-hidden-mark" d="m4 4 16 16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit">Entrar</button>

                <div class="auth-links">
                    <a href="register.html">Criar conta</a>
                </div>
            </form>
            <div class="auth-divider">ou</div>
            <div id="googleLoginButton" aria-label="Entrar com uma conta Google"></div>
            <p id="googleLoginStatus" role="status" aria-live="polite"></p>
        </div>
    </div>

    <script>
        const senhaLogin = document.getElementById('senhaLogin');
        const toggleSenha = document.getElementById('toggleSenha');
        const marcaSenhaOculta = toggleSenha.querySelector('.password-hidden-mark');

        toggleSenha.addEventListener('click', () => {
            const senhaVisivel = senhaLogin.type === 'password';
            senhaLogin.type = senhaVisivel ? 'text' : 'password';
            toggleSenha.setAttribute('aria-label', senhaVisivel ? 'Ocultar senha' : 'Mostrar senha');
            toggleSenha.setAttribute('aria-pressed', String(senhaVisivel));
            marcaSenhaOculta.style.display = senhaVisivel ? 'none' : '';
        });
    </script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
