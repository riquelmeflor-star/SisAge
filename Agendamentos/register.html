<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - CETI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1B365D 0%, #2A4B7C 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        .auth-header {
            background: var(--navy);
            color: #fff;
            padding: 24px 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #cfe2ff;
            font-size: 13px;
        }

        .auth-body {
            padding: 28px 24px 24px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
        }

        .auth-form input,
        .auth-form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .auth-form button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--green);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-links {
            text-align: center;
            font-size: 12px;
            margin-top: 8px;
        }

        .auth-links a {
            color: var(--blue);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Registrar</h1>
            <p>Criar novo usuário no CETI</p>
        </div>

        <div class="auth-body">
            <form id="registerForm" class="auth-form">
                <div>
                    <label for="nome">Nome completo</label>
                    <input id="nome" type="text" placeholder="Digite seu nome" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="Digite seu e-mail" required>
                </div>

                <div>
                    <label for="cargo">Cargo</label>
                    <select id="cargo">
                        <option value="docente">Docente</option>
                        <option value="coordenador">Coordenador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div>
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input id="confirmarSenha" type="password" placeholder="Repita a senha" required>
                </div>

                <button type="submit">Cadastrar</button>

                <div class="auth-links">
                    <a href="login.html">Já tenho conta</a>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
