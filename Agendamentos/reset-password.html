<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - CETI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1B365D 0%, #2A4B7C 100%);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        .auth-header {
            background: var(--navy);
            color: #fff;
            padding: 24px 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: #cfe2ff;
            font-size: 13px;
        }

        .auth-body {
            padding: 28px 24px 24px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
        }

        .auth-form input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .auth-form button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--navy);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-links {
            text-align: center;
            font-size: 12px;
            margin-top: 8px;
        }

        .auth-links a {
            color: var(--blue);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Redefinir senha</h1>
            <p>Atualize sua senha de acesso</p>
        </div>

        <div class="auth-body">
            <form id="resetForm" class="auth-form">
                <div>
                    <label for="emailReset">E-mail</label>
                    <input id="emailReset" type="email" placeholder="Digite seu e-mail cadastrado" required>
                </div>

                <div>
                    <label for="novaSenha">Nova senha</label>
                    <input id="novaSenha" type="password" placeholder="Informe a nova senha" required>
                </div>

                <div>
                    <label for="confirmarNovaSenha">Confirmar nova senha</label>
                    <input id="confirmarNovaSenha" type="password" placeholder="Repita a nova senha" required>
                </div>

                <button type="submit">Salvar nova senha</button>

                <div class="auth-links">
                    <a href="login.html">Voltar para login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
